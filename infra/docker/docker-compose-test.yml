name: wishwe-local-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wishwe_test
      POSTGRES_USER: wishwe
      POSTGRES_PASSWORD: wishwe-local-only
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishwe -d wishwe_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - test

  django:
    image: wishwe-backend-test:local
    build:
      context: ../../backend
      dockerfile: ../infra/docker/django/Dockerfile
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    environment: &backend_environment
      SECRET_KEY: local-docker-test-only
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: wishwe_api.settings_test
      DB_NAME: wishwe_test
      DB_USER: wishwe
      DB_PASSWORD: wishwe-local-only
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SERVE_MEDIA_LOCALLY: "true"
    env_file:
      - path: .env.test
        required: false
    ports:
      - "8000:8000"
    volumes:
      - test_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:8000/api/health/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - test

  celery_worker:
    image: wishwe-backend-test:local
    build:
      context: ../../backend
      dockerfile: ../infra/docker/django/Dockerfile
    command: celery -A wishwe_api worker -l info
    environment: *backend_environment
    env_file:
      - path: .env.test
        required: false
    volumes:
      - test_media:/app/media
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test

  celery_beat:
    image: wishwe-backend-test:local
    build:
      context: ../../backend
      dockerfile: ../infra/docker/django/Dockerfile
    command: >-
      celery -A wishwe_api beat -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *backend_environment
    env_file:
      - path: .env.test
        required: false
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://django:8000
      NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ""
      GOOGLE_MAPS_KEY: ""
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app
      - test_frontend_node_modules:/app/node_modules
      - test_frontend_next:/app/.next
    depends_on:
      django:
        condition: service_healthy
    networks:
      - test

volumes:
  test_postgres_data:
  test_media:
  test_frontend_node_modules:
  test_frontend_next:

networks:
  test:
    driver: bridge
