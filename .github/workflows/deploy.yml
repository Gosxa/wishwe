name: Notify Discord on Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (deploy triggered)
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "Deployment triggered"
          description: "🚀 `${{ github.repository }}` — push by **${{ github.actor }}**."
          color: 0x5865f2
